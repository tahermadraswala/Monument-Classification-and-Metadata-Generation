<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="Monument Detection and Metadata Collection - A modern web app for analyzing monuments and collecting metadata."
    />

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Monument Detection and Metadata Collection" />
    <meta property="og:description" content="A modern web application for detecting monuments and collecting metadata efficiently." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/preview.png" />
    <meta property="og:url" content="https://yourwebsite.com" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Web Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Google Fonts: Poppins -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Monument Detection and Metadata Collection</title>

    <style>
      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #2563eb, #7c3aed, #ec4899);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        color: #fff;
        transition: 0.5s;
        text-align: center;
      }

      @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      body.dark {
        background: linear-gradient(135deg, #1f2937, #111827);
        color: #f9fafb;
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        margin: 20px 0;
      }

      button {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        margin-bottom: 20px;
      }

      .toggle-dark {
        background: #2563eb;
        color: #fff;
      }

      .toggle-light {
        background: #facc15;
        color: #111;
      }

      .upload-box {
        border: 2px dashed #fff;
        border-radius: 16px;
        padding: 30px;
        margin: 20px auto;
        width: 80%;
        max-width: 500px;
        cursor: pointer;
        transition: 0.3s;
      }

      .upload-box:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .upload-preview {
        max-width: 90%;
        margin: 20px auto;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      }

      .card {
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 16px;
        padding: 20px;
        margin: 15px auto;
        max-width: 400px;
        text-align: left;
        color: #fff;
      }

      .card h3 {
        margin-top: 0;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Monument Detection & Metadata Collection</h1>

    <!-- Dark Mode Toggle -->
    <button id="themeToggle" class="toggle-dark">🌙 Dark Mode</button>

    <!-- Drag & Drop Upload -->
    <div class="upload-box" id="uploadBox">
      <p>Drag & Drop an image here, or click to upload</p>
      <input type="file" id="fileInput" accept="image/*" style="display: none;" />
    </div>

    <!-- Preview -->
    <img id="preview" class="upload-preview" style="display:none;" />

    <!-- Metadata Cards -->
    <div id="metadata" style="display:none;">
      <div class="card">
        <h3>🏛️ Taj Mahal</h3>
        <p>Location: Agra, India | Era: Mughal | UNESCO Heritage Site</p>
      </div>
      <div class="card">
        <h3>📖 Detected Features</h3>
        <p>Architecture: Marble | Style: Persian-Islamic | Year: 1632</p>
      </div>
      <div class="card">
        <h3>📍 Coordinates</h3>
        <p>27.1751° N, 78.0421° E</p>
      </div>
    </div>

    <script>
      const themeToggle = document.getElementById("themeToggle");
      themeToggle.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        if (document.body.classList.contains("dark")) {
          themeToggle.textContent = "☀️ Light Mode";
          themeToggle.className = "toggle-light";
        } else {
          themeToggle.textContent = "🌙 Dark Mode";
          themeToggle.className = "toggle-dark";
        }
      });

      const uploadBox = document.getElementById("uploadBox");
      const fileInput = document.getElementById("fileInput");
      const preview = document.getElementById("preview");
      const metadata = document.getElementById("metadata");

      uploadBox.addEventListener("click", () => fileInput.click());

      uploadBox.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadBox.style.background = "rgba(255,255,255,0.2)";
      });

      uploadBox.addEventListener("dragleave", () => {
        uploadBox.style.background = "transparent";
      });

      uploadBox.addEventListener("drop", (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith("image/")) {
          showPreview(file);
        }
      });

      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (file && file.type.startsWith("image/")) {
          showPreview(file);
        }
      });

      function showPreview(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          preview.src = e.target.result;
          preview.style.display = "block";
          metadata.style.display = "block";
        };
        reader.readAsDataURL(file);
      }
    </script>
  </body>
</html>
